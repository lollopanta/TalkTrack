name: Build desktop apps

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            runner: macos-15
            artifact: macos-arm64
          - platform: Windows-x64
            runner: windows-2022
            artifact: windows-x64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU PyTorch (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install --upgrade pip torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install anthropic openai google-generativeai mistralai groq pyinstaller

      - name: Build native macOS audio helper
        if: runner.os == 'macOS'
        run: bash scripts/build_macos_audio_helper.sh

      - name: Prepare macOS app icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p resources/TalkTrack.iconset
          sips -z 16 16 resources/TT_icon_512x512.png --out resources/TalkTrack.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 resources/TT_icon_512x512.png --out resources/TalkTrack.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 resources/TT_icon_512x512.png --out resources/TalkTrack.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 resources/TT_icon_512x512.png --out resources/TalkTrack.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 resources/TT_icon_512x512.png --out resources/TalkTrack.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 resources/TT_icon_512x512.png --out resources/TalkTrack.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 resources/TT_icon_512x512.png --out resources/TalkTrack.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 resources/TT_icon_512x512.png --out resources/TalkTrack.iconset/icon_256x256@2x.png >/dev/null
          iconutil -c icns resources/TalkTrack.iconset -o resources/talktrack.icns

      - name: Freeze application
        run: python -m PyInstaller --noconfirm --clean TalkTrack.spec

      - name: Verify bundled macOS audio helper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          helper="$(find dist/TalkTrack.app -path '*/.build/TalkTrackAudioCapture.app/Contents/MacOS/TalkTrackAudioCapture' -type f -print -quit)"
          test -n "$helper"
          test -x "$helper"

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/TalkTrack.app TalkTrack-${{ matrix.artifact }}.zip

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: tar -a -c -f TalkTrack-${{ matrix.artifact }}.zip -C dist TalkTrack

      - uses: actions/upload-artifact@v7
        with:
          name: TalkTrack-${{ matrix.artifact }}
          path: TalkTrack-${{ matrix.artifact }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
